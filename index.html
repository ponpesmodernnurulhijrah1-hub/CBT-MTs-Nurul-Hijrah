<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta id="app-viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="app-version" content="__APP_VERSION__" />
    <meta name="app-build-hash" content="__APP_BUILD_HASH__" />
    <script>
      (function () {
        var viewportEl = document.getElementById('app-viewport');
        var idealViewport = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
        if (viewportEl && viewportEl.getAttribute('content') !== idealViewport) {
          viewportEl.setAttribute('content', idealViewport);
        }
        try {
          var isTouch =
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
            navigator.maxTouchPoints > 0;
          var sw = (window.screen && (window.screen.availWidth || window.screen.width)) || 0;
          if (isTouch && sw > 0 && sw <= 640 && document.documentElement.clientWidth >= 800 && viewportEl) {
            viewportEl.setAttribute('content', 'width=device-width, initial-scale=1.0001, viewport-fit=cover');
            viewportEl.setAttribute('content', idealViewport);
          }
        } catch (e) {}
        var CURRENT_VERSION = '__APP_VERSION__';
        var CURRENT_HASH = '__APP_BUILD_HASH__';
        var VERSION_KEY = 'cbt_app_version';
        var HASH_KEY = 'cbt_app_build_hash';
        var SCHEMA_KEY = 'cbt_app_schema_version';
        var LEGACY_KEYS = [
          'cbt_nurul_hijrah_db_v1',
          'cbt_mts_nurul_hijrah_db_v1',
          'cbt_mts_nurul_hijrah_seeded_v1',
          'cbt_db_v1',
          'cbt_v1_state',
          'cbt_pwa_version',
          'cbt_cached_version',
        ];
        var isStamped =
          CURRENT_VERSION &&
          CURRENT_VERSION.indexOf('APP_VERSION') === -1 &&
          CURRENT_HASH &&
          CURRENT_HASH.indexOf('APP_BUILD_HASH') === -1;

        function clearLegacyStorage() {
          for (var i = 0; i < LEGACY_KEYS.length; i++) {
            try {
              localStorage.removeItem(LEGACY_KEYS[i]);
            } catch (e) {}
          }
        }

        function unregisterAllServiceWorkers() {
          if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistrations) {
            return Promise.resolve(false);
          }
          return navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              if (!regs || regs.length === 0) return false;
              return Promise.all(
                regs.map(function (reg) {
                  return reg.unregister().catch(function () {
                    return false;
                  });
                })
              ).then(function () {
                return true;
              });
            })
            .catch(function () {
              return false;
            });
        }

        function deleteAllCacheStorage() {
          if (!('caches' in window)) return Promise.resolve(false);
          return caches
            .keys()
            .then(function (keys) {
              if (!keys || keys.length === 0) return false;
              return Promise.all(
                keys.map(function (key) {
                  return caches.delete(key).catch(function () {
                    return false;
                  });
                })
              ).then(function () {
                return true;
              });
            })
            .catch(function () {
              return false;
            });
        }

        function hardReloadOnce(targetVersion, targetHash) {
          var guardKey = 'cbt_preboot_reload_' + (targetVersion || '') + '_' + (targetHash || '');
          try {
            if (sessionStorage.getItem(guardKey)) return;
            sessionStorage.setItem(guardKey, '1');
          } catch (e) {}
          try {
            window.location.reload(true);
          } catch (e) {
            window.location.reload();
          }
        }

        function purgeAndReload(nextVersion, nextHash) {
          clearLegacyStorage();
          try {
            if (nextVersion) localStorage.setItem(VERSION_KEY, nextVersion);
            if (nextHash) localStorage.setItem(HASH_KEY, nextHash);
          } catch (e) {}
          return Promise.all([unregisterAllServiceWorkers(), deleteAllCacheStorage()]).finally(
            function () {
              hardReloadOnce(nextVersion, nextHash);
            }
          );
        }

        if (isStamped) {
          var savedVersion = null;
          var savedHash = null;
          var savedSchema = 0;
          var hasLegacyKeys = false;
          var hadControllerBeforeBoot = Boolean(
            'serviceWorker' in navigator && navigator.serviceWorker.controller
          );

          try {
            savedVersion = localStorage.getItem(VERSION_KEY);
            savedHash = localStorage.getItem(HASH_KEY);
            savedSchema = Number(localStorage.getItem(SCHEMA_KEY) || '0');
            for (var j = 0; j < LEGACY_KEYS.length; j++) {
              if (localStorage.getItem(LEGACY_KEYS[j]) !== null) {
                hasLegacyKeys = true;
                break;
              }
            }
          } catch (e) {}

          var isVersionMismatch = Boolean(savedVersion && savedVersion !== CURRENT_VERSION);
          var isHashMismatch = Boolean(savedHash && savedHash !== CURRENT_HASH);
          var isLegacySchema = savedSchema > 0 && savedSchema < 8;

          if (isVersionMismatch || isHashMismatch || isLegacySchema || hasLegacyKeys) {
            purgeAndReload(CURRENT_VERSION, CURRENT_HASH);
            return;
          }

          if (!savedVersion) {
            try {
              localStorage.setItem(VERSION_KEY, CURRENT_VERSION);
              localStorage.setItem(HASH_KEY, CURRENT_HASH);
            } catch (e) {}

            // Only purge on first unversioned boot if an OLD controller was already active before boot
            // OR stale cache buckets from a previous release exist (never wipe a freshly registering SW).
            Promise.resolve(
              'caches' in window
                ? caches.keys().catch(function () {
                    return [];
                  })
                : []
            ).then(function (cacheKeys) {
              var currentTag = CURRENT_HASH.slice(0, 10);
              var hasStaleCaches = (cacheKeys || []).some(function (key) {
                return (
                  key !== 'google-fonts-cache' &&
                  key.indexOf(currentTag) === -1 &&
                  key.indexOf('workbox-precache') === -1
                );
              });
              if (hadControllerBeforeBoot || hasStaleCaches) {
                purgeAndReload(CURRENT_VERSION, CURRENT_HASH);
              }
            });
          } else {
            try {
              localStorage.setItem(VERSION_KEY, CURRENT_VERSION);
              localStorage.setItem(HASH_KEY, CURRENT_HASH);
            } catch (e) {}
          }

          // Cross-check authoritative server version manifest immediately with strict 5s timeout so slow cold starts never stall boot.
          var verifyServer = function (endpoint) {
            var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            var timerId = controller
              ? setTimeout(function () {
                  controller.abort();
                }, 5000)
              : null;
            return fetch(endpoint + '?_cb=' + Date.now(), {
              cache: 'no-store',
              headers: { 'Cache-Control': 'no-cache' },
              signal: controller ? controller.signal : undefined,
            })
              .then(function (r) {
                if (timerId !== null) clearTimeout(timerId);
                if (!r.ok) throw new Error('Manifest unavailable');
                return r.json();
              })
              .catch(function (err) {
                if (timerId !== null) clearTimeout(timerId);
                throw err;
              });
          };

          verifyServer('/api/version')
            .catch(function () {
              return verifyServer('/version.json');
            })
            .then(function (manifest) {
              if (!manifest) return;
              var srvVer = typeof manifest.version === 'string' ? manifest.version.trim() : '';
              var srvHash =
                typeof manifest.buildHash === 'string'
                  ? manifest.buildHash.trim()
                  : typeof manifest.buildId === 'string'
                    ? manifest.buildId.trim()
                    : '';
              var storedVer = null;
              try {
                storedVer = localStorage.getItem(VERSION_KEY);
              } catch (e) {}
              if (
                (srvVer && (srvVer !== CURRENT_VERSION || (storedVer && storedVer !== srvVer))) ||
                (srvHash && srvHash !== CURRENT_HASH)
              ) {
                purgeAndReload(srvVer || CURRENT_VERSION, srvHash || CURRENT_HASH);
              }
            })
            .catch(function () {});
        }

        window.addEventListener('vite:preloadError', function (ev) {
          ev.preventDefault();
          purgeAndReload(CURRENT_VERSION, CURRENT_HASH);
        });
      })();
    </script>
